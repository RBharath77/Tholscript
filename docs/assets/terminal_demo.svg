<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 320" width="100%" height="320">
  <defs>
    <linearGradient id="termBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#121824"/>
    </linearGradient>
    <filter id="curGlow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes lineFade {
      0% { opacity: 0; transform: translateY(4px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    .term-title { font-family: -apple-system, BlinkMacSystemFont, monospace; font-size: 12px; fill: #8b949e; text-anchor: middle; }
    .term-code { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 12.5px; fill: #c9d1d9; }
    .cmd-prompt { fill: #d4af37; font-weight: bold; }
    .cmd-text { fill: #f0f6fc; font-weight: 600; }
    .tag-blue { fill: #58a6ff; font-weight: bold; }
    .tag-green { fill: #3fb950; font-weight: bold; }
    .tag-purple { fill: #bc8cff; font-weight: bold; }
    .tag-gold { fill: #d4af37; font-weight: bold; }
    .cursor { fill: #d4af37; animation: blink 1s infinite; }
  </style>

  <!-- Window Container -->
  <rect width="848" height="318" x="1" y="1" rx="12" fill="url(#termBg)" stroke="#30363d" stroke-width="1.5"/>

  <!-- Window Titlebar -->
  <path d="M 1 12 C 1 5.9 5.9 1 12 1 L 836 1 C 842.1 1 847 5.9 847 12 L 847 38 L 1 38 Z" fill="#161b22"/>
  <line x1="1" y1="38" x2="848" y2="38" stroke="#30363d" stroke-width="1"/>

  <!-- macOS Window Controls -->
  <circle cx="20" cy="19" r="6" fill="#ff5f56"/>
  <circle cx="40" cy="19" r="6" fill="#ffbd2e"/>
  <circle cx="60" cy="19" r="6" fill="#27c93f"/>

  <text x="424" y="24" class="term-title">zsh &mdash; tholscript epigraphic engine &mdash; 80x24</text>

  <!-- Terminal Content Lines -->
  <g transform="translate(24, 68)" class="term-code">
    <!-- Prompt Line -->
    <text x="0" y="0">
      <tspan class="cmd-prompt">tholscript ❯ </tspan>
      <tspan class="cmd-text">python -m tholscript.scripts.cli demo --key real_photo --translate</tspan>
    </text>

    <!-- Output Lines -->
    <text x="0" y="26">
      <tspan class="tag-blue">[1/6 vision] </tspan>
      <tspan>Adaptive CLAHE contrast active &bull; High-freq energy: 0.041 (Real stone slab)</tspan>
    </text>

    <text x="0" y="50">
      <tspan class="tag-blue">[2/6 segment]</tspan>
      <tspan> Found 4 line bands &bull; Hysteresis peak tracking &bull; Projection IoU: 0.91</tspan>
    </text>

    <text x="0" y="74">
      <tspan class="tag-purple">[3/6 crnn]   </tspan>
      <tspan> Bi-LSTM forward pass &bull; CTC sequence alignment &bull; Mean conf: 94.6%</tspan>
    </text>

    <text x="0" y="98">
      <tspan class="tag-green">[4/6 consensus]</tspan>
      <tspan> CRNN &times; Glyph-CNN cross-check &bull; </tspan>
      <tspan fill="#3fb950" font-weight="bold">Consensus: Agreement ✓</tspan>
    </text>

    <text x="0" y="122">
      <tspan class="tag-gold">[5/6 lexicon]</tspan>
      <tspan> Snapped 2 worn characters to epigraphic dictionary via 3-gram LM</tspan>
    </text>

    <text x="0" y="152" fill="#79c0ff">
      <tspan fill="#d4af37">MODERN TAMIL: </tspan>
      <tspan font-weight="bold" fill="#ffffff">சேரி இங்கு கல்வெட்டு அதிகன் நள்ளி நிறுவினான்</tspan>
    </text>

    <text x="0" y="176" fill="#a5d6ff">
      <tspan fill="#d4af37">ENGLISH GLOSS:</tspan>
      <tspan font-style="italic"> The chieftain Nalli erected this inscription stone in the Cheri settlement</tspan>
    </text>

    <text x="0" y="202">
      <tspan class="tag-green">[6/6 outputs]</tspan>
      <tspan> 🔊 Web Speech TTS synced (0.75x) &bull; 🌐 Indic Translations &bull; 📄 A4 PDF Dossier ready</tspan>
    </text>

    <!-- Active Prompt with Blinking Cursor -->
    <text x="0" y="232">
      <tspan class="cmd-prompt">tholscript ❯ </tspan>
      <tspan class="cursor">▋</tspan>
    </text>
  </g>
</svg>
