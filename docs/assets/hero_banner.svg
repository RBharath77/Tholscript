<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 280" width="100%" height="280">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d14"/>
      <stop offset="50%" stop-color="#0f141c"/>
      <stop offset="100%" stop-color="#161c28"/>
    </linearGradient>

    <!-- Gold Text Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f6d365">
        <animate attributeName="stop-color" values="#f6d365;#fda085;#f6d365" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#d4af37">
        <animate attributeName="stop-color" values="#d4af37;#ffe066;#d4af37" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#f5af19">
        <animate attributeName="stop-color" values="#f5af19;#f6d365;#f5af19" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="scanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Scanning Laser Animation -->
    <linearGradient id="laserGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(212,175,55,0)"/>
      <stop offset="50%" stop-color="rgba(212,175,55,0.85)"/>
      <stop offset="100%" stop-color="rgba(212,175,55,0)"/>
    </linearGradient>
  </defs>

  <style>
    @keyframes pulseGlow {
      0%, 100% { filter: drop-shadow(0 0 8px rgba(212,175,55,0.4)); transform: scale(1); }
      50% { filter: drop-shadow(0 0 20px rgba(212,175,55,0.8)); transform: scale(1.02); }
    }
    @keyframes scanSweep {
      0% { transform: translateY(0px); opacity: 0; }
      15% { opacity: 0.8; }
      85% { opacity: 0.8; }
      100% { transform: translateY(276px); opacity: 0; }
    }
    @keyframes floatParticle {
      0%, 100% { transform: translate(0, 0); opacity: 0.3; }
      50% { transform: translate(10px, -15px); opacity: 0.9; }
    }
    .banner-card { stroke: #d4af37; stroke-width: 1.5; stroke-opacity: 0.4; }
    .seal-wrap { transform-origin: 100px 140px; animation: pulseGlow 4s ease-in-out infinite; }
    .scan-beam { animation: scanSweep 4.5s ease-in-out infinite; }
    .title-main { font-family: 'Cinzel', 'Times New Roman', Georgia, serif; font-size: 34px; font-weight: 800; letter-spacing: 0.08em; fill: url(#goldGrad); }
    .subtitle-ta { font-family: 'Noto Sans Tamil', 'Latha', sans-serif; font-size: 15px; font-weight: 600; fill: #e6edf3; letter-spacing: 0.05em; }
    .desc-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13px; fill: #8b949e; }
    .badge-rect { rx: 6px; fill: rgba(212,175,55,0.08); stroke: rgba(212,175,55,0.3); stroke-width: 1; }
    .badge-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', monospace; font-size: 11px; font-weight: 600; fill: #d4af37; letter-spacing: 0.04em; }
  </style>

  <!-- Background Canvas -->
  <rect width="848" height="278" x="1" y="1" rx="14" fill="url(#bgGrad)" class="banner-card"/>

  <!-- Subtle Ancient Grid Lattice Pattern -->
  <g opacity="0.07" stroke="#d4af37" stroke-width="0.75">
    <line x1="0" y1="40" x2="850" y2="40"/>
    <line x1="0" y1="80" x2="850" y2="80"/>
    <line x1="0" y1="120" x2="850" y2="120"/>
    <line x1="0" y1="160" x2="850" y2="160"/>
    <line x1="0" y1="200" x2="850" y2="200"/>
    <line x1="0" y1="240" x2="850" y2="240"/>
    <line x1="170" y1="0" x2="170" y2="280"/>
    <line x1="340" y1="0" x2="340" y2="280"/>
    <line x1="510" y1="0" x2="510" y2="280"/>
    <line x1="680" y1="0" x2="680" y2="280"/>
  </g>

  <!-- Animated Scanning Laser Line -->
  <g class="scan-beam">
    <line x1="2" y1="0" x2="848" y2="0" stroke="url(#laserGrad)" stroke-width="2.5" filter="url(#scanGlow)"/>
  </g>

  <!-- Left Epigraphic Seal Medallion -->
  <g class="seal-wrap" transform="translate(10, 0)">
    <!-- Outer Decorative Ring -->
    <circle cx="100" cy="140" r="62" fill="none" stroke="#d4af37" stroke-width="1.8" stroke-dasharray="6,4" opacity="0.6"/>
    <!-- Inner Solid Ring -->
    <circle cx="100" cy="140" r="54" fill="#131922" stroke="#d4af37" stroke-width="2.2"/>
    <!-- Brahmic Ancient Glyph -->
    <text x="100" y="148" text-anchor="middle" font-family="'Noto Sans Brahmi', serif" font-size="44" fill="#d4af37" font-weight="bold" filter="url(#goldGlow)">𑀢𑁄</text>
    <!-- Tamil Script Top & Bottom Arc -->
    <text x="100" y="104" text-anchor="middle" font-family="'Noto Sans Tamil', serif" font-size="9" font-weight="700" fill="#a371f7" letter-spacing="0.1em">தொல்லெழுத்து</text>
    <text x="100" y="182" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="8.5" font-weight="700" fill="#d4af37" letter-spacing="0.12em">BHARATH R</text>
  </g>

  <!-- Center & Right Typography Area -->
  <g transform="translate(195, 0)">
    <!-- Main Title -->
    <text x="0" y="68" class="title-main" filter="url(#goldGlow)">THOLSCRIPT</text>
    <!-- Tamil & Brahmi Script Title -->
    <text x="270" y="66" class="subtitle-ta">· தொல்லெழுத்து · 𑀢𑁄𑀮𑁆</text>
    <text x="560" y="66" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#d4af37" letter-spacing="0.08em">BY BHARATH R</text>

    <!-- Subtitle / Mission Statement -->
    <text x="2" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14.5" font-weight="600" fill="#e6edf3">
      Ancient Epigraphic OCR, Multi-Grapheme Transliteration &amp; Synchronized Voice Synthesizer
    </text>

    <!-- Technical Pitch -->
    <text x="2" y="128" class="desc-text">
      Deciphers damaged ancient stone inscriptions (erosion, chipping, raking light) via Dual-Reader
    </text>
    <text x="2" y="148" class="desc-text">
      Neural Consensus (CRNN + CTC &amp; Glyph CNN) with physical degradation modeling.
    </text>

    <!-- Capability Badges Row -->
    <g transform="translate(2, 178)">
      <!-- Badge 1: Dual Reader -->
      <rect x="0" y="0" width="138" height="28" class="badge-rect"/>
      <text x="69" y="18" text-anchor="middle" class="badge-text">⚡ CRNN + CNN Reader</text>

      <!-- Badge 2: CPU First -->
      <rect x="146" y="0" width="128" height="28" class="badge-rect"/>
      <text x="210" y="18" text-anchor="middle" class="badge-text">💻 Zero GPU (CPU-First)</text>

      <!-- Badge 3: Multi-Language -->
      <rect x="282" y="0" width="132" height="28" class="badge-rect"/>
      <text x="348" y="18" text-anchor="middle" class="badge-text">🌐 7+ Indic Languages</text>

      <!-- Badge 4: Voice Synthesizer -->
      <rect x="422" y="0" width="124" height="28" class="badge-rect"/>
      <text x="484" y="18" text-anchor="middle" class="badge-text">🔊 Voice Synthesizer</text>

      <!-- Badge 5: PDF Dossier -->
      <rect x="554" y="0" width="84" height="28" class="badge-rect"/>
      <text x="596" y="18" text-anchor="middle" class="badge-text">📄 A4 PDF</text>
    </g>

    <!-- Bottom Status Line -->
    <g transform="translate(2, 235)">
      <circle cx="6" cy="6" r="4" fill="#3fb950"/>
      <circle cx="6" cy="6" r="8" fill="none" stroke="#3fb950" stroke-width="1.5" opacity="0.6">
        <animate attributeName="r" values="4;10;4" dur="2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.8;0;0.8" dur="2s" repeatCount="indefinite"/>
      </circle>
      <text x="22" y="10" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#3fb950">
        Created by Bharath R · All 26 Tests Passing · EpiDoc TEI-XML Standard · Interactive 2.5x Loupe
      </text>
    </g>
  </g>
</svg>
